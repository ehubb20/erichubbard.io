<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Preview of the weekly business review headline slide">
<style>
  :root { color-scheme: light dark; }
  .bg   { fill: #fdfdfb; }
  .ink  { fill: #1b1b18; }
  .soft { fill: #45453f; }
  .mut  { fill: #6e6e66; }
  .rule { stroke: #e0e0d8; }
  .hard { stroke: #1b1b18; }
  .pos  { fill: #2c6a4c; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #131315; }
    .ink  { fill: #e9e9e3; }
    .soft { fill: #c2c2ba; }
    .mut  { fill: #8c8c84; }
    .rule { stroke: #2c2c30; }
    .hard { stroke: #e9e9e3; }
    .pos  { fill: #6fbf94; }
  }
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .label { font-size: 11px; letter-spacing: 1.7px; }
  .val { font-size: 32px; letter-spacing: -1px; }
  .delta { font-size: 13px; }
  .body { font-size: 13.5px; }
</style>

<rect class="bg" width="960" height="540"/>

<!-- masthead -->
<text class="mono label mut" x="56" y="52">WBR · 2026-08-09</text>
<text class="mono label mut" x="904" y="52" text-anchor="end">02</text>
<line class="rule" x1="56" y1="68" x2="904" y2="68" stroke-width="1"/>

<text class="mono label mut" x="56" y="106">WEEK ENDING 2026-08-09</text>
<text class="ink" x="56" y="150" font-size="34" font-weight="600" letter-spacing="-0.6">Headlines</text>
<line class="hard" x1="56" y1="176" x2="904" y2="176" stroke-width="2"/>

<!-- KPI row -->
<g>
  <text class="mono label mut" x="56"  y="212">GMV / WEEK</text>
  <text class="mono val ink"   x="56"  y="256">$1,847,300</text>
  <text class="mono delta pos" x="56"  y="278">+58.4% WoW</text>

  <text class="mono label mut" x="300" y="212">UNITS SOLD</text>
  <text class="mono val ink"   x="300" y="256">5,412</text>
  <text class="mono delta pos" x="300" y="278">+41.2% WoW</text>

  <text class="mono label mut" x="540" y="212">IN-STOCK RATE</text>
  <text class="mono val ink"   x="540" y="256">41.7%</text>
  <text class="mono delta pos" x="540" y="278">+3.8 pp WoW</text>

  <text class="mono label mut" x="770" y="212">DAYS OF SUPPLY</text>
  <text class="mono val ink"   x="770" y="256">5</text>
  <text class="mono delta mut" x="770" y="278">binding</text>
</g>

<line class="rule" x1="56" y1="312" x2="904" y2="312" stroke-width="1"/>

<!-- two-up -->
<text class="mono label soft" x="56"  y="344">/ WHAT'S WORKING</text>
<text class="body soft" x="56" y="372">— Week GMV $1,847,300, up 58.4%, every channel up.</text>
<text class="body soft" x="56" y="396">— Amazon +94.7%; eBay +71.2% to $712,540.</text>
<text class="body soft" x="56" y="420">— Units 5,412 on traffic up 15.3%.</text>
<text class="body soft" x="56" y="444">— Retail readiness best on the template.</text>

<text class="mono label soft" x="506" y="344">/ WHAT NEEDS ATTENTION</text>
<text class="body soft" x="506" y="372">— Days of supply is 5 — selling faster than restock.</text>
<text class="body soft" x="506" y="396">— Featured offer win 6.2%; price-competitive 24.8%.</text>
<text class="body soft" x="506" y="420">— In-stock 41.7% — under half the catalogue buyable.</text>
<text class="body soft" x="506" y="444">— Backmarket −19.4% YoY, the only channel below.</text>

<line class="rule" x1="56" y1="480" x2="904" y2="480" stroke-width="1"/>
<text class="mono label mut" x="56" y="506">SYNTHETIC SAMPLE — ALL FIGURES INVENTED</text>
</svg>
